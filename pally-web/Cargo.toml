[package]
name = "pally-web"
version = "0.1.0"
edition = "2024"
authors = ["Persune <gumball2415@gmail.com>"]
description = "WASM JS interface for Pally."
readme = "../README.md"
repository = "https://github.com/Gumball2415/pally"
license-file = "../LICENSE.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
nes_ppu_cvbs = { path = "../nes_ppu_cvbs" }
cvbs_decode = { path = "../cvbs_decode" }
pally = { path = "../pally" }
wasm-bindgen = "0.2"
js-sys = "0.3.77"

[dev-dependencies]
wasm-bindgen-test = "0.3.0"